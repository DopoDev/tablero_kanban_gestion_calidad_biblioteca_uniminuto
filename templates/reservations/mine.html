{% extends "base.html" %}
{% block title %}Mis reservas{% endblock %}
{% block content %}
<div class="page">
    <h1 class="title">Mis reservas</h1>
    <div class="card">
        <form hx-post="/reservations" hx-target="#reservation-table" hx-swap="outerHTML">
            <div class="form-group">
                <label for="book_id">ID del libro</label>
                <input class="input" type="number" id="book_id" name="book_id" required>
            </div>
            <button class="btn btn-primary" type="submit">Reservar</button>
        </form>
        <div id="form-message"></div>
    </div>
    {% include "reservations/_rows.html" %}
</div>
{% endblock %}
