{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="container">
    <div class="card">
        <h1 class="title">Crear cuenta</h1>
        <form hx-post="/auth/register" hx-target="#form-message" hx-swap="innerHTML">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input class="input" type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Correo</label>
                <input class="input" type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input class="input" type="password" id="password" name="password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="phone">Telefono (opcional)</label>
                <input class="input" type="tel" id="phone" name="phone">
            </div>
            <div class="form-group">
                <label for="role">Tipo de usuario</label>
                <select class="input" id="role" name="role">
                    <option value="STUDENT">Estudiante</option>
                    <option value="COMMUNITY">Comunidad</option>
                </select>
            </div>
            <button class="btn btn-primary" type="submit">Registrarme</button>
        </form>
        <div id="form-message"></div>
        <p class="paragraph"><a class="link" href="/auth/login">Ya tengo cuenta</a></p>
    </div>
</div>
{% endblock %}
