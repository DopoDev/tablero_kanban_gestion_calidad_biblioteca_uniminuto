{% extends "base.html" %}
{% block title %}{{ "Editar libro" if book else "Registrar libro" }}{% endblock %}
{% block content %}
<div class="container">
    <div class="card">
        <h1 class="title">{{ "Editar libro" if book else "Registrar libro" }}</h1>
        <form
            hx-post="{{ '/books/%d/edit' % book.id if book else '/books/new' }}"
            hx-target="#form-message"
            hx-swap="innerHTML"
        >
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input class="input" type="text" id="isbn" name="isbn" value="{{ book.isbn if book else '' }}" required>
            </div>
            <div class="form-group">
                <label for="title">Titulo</label>
                <input class="input" type="text" id="title" name="title" value="{{ book.title if book else '' }}" required>
            </div>
            <div class="form-group">
                <label for="author">Autor</label>
                <input class="input" type="text" id="author" name="author" value="{{ book.author if book else '' }}" required>
            </div>
            <div class="form-group">
                <label for="category">Categoria</label>
                <input class="input" type="text" id="category" name="category" value="{{ book.category if book else '' }}" required>
            </div>
            <div class="form-group">
                <label for="publisher">Editorial</label>
                <input class="input" type="text" id="publisher" name="publisher" value="{{ book.publisher if book else '' }}">
            </div>
            <div class="form-group">
                <label for="publication_year">Año de publicacion</label>
                <input class="input" type="number" id="publication_year" name="publication_year" value="{{ book.publication_year if book else '' }}">
            </div>
            <div class="form-group">
                <label for="total_copies">Ejemplares</label>
                <input class="input" type="number" id="total_copies" name="total_copies" min="1" value="{{ book.total_copies if book else '1' }}" required>
            </div>
            <div class="form-group">
                <label for="description">Descripcion</label>
                <textarea class="input" id="description" name="description">{{ book.description if book else '' }}</textarea>
            </div>
            <button class="btn btn-primary" type="submit">Guardar</button>
        </form>
        <div id="form-message"></div>
    </div>
</div>
{% endblock %}
