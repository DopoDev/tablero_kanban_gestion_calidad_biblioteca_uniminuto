<table class="table" id="reader-table">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Telefono</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for reader in readers %}
        <tr>
            <td>{{ reader.name }}</td>
            <td>{{ reader.email }}</td>
            <td>{{ reader.role.value }}</td>
            <td>
                <form hx-post="/readers/{{ reader.id }}/edit" hx-target="#reader-table" hx-swap="outerHTML">
                    <input class="input" type="tel" name="phone" value="{{ reader.phone or '' }}" placeholder="Telefono">
                </form>
            </td>
            <td>{{ reader.status.value }}</td>
            <td>
                {% if reader.status.value == "ACTIVE" %}
                <button class="btn btn-inline" hx-post="/readers/{{ reader.id }}/suspend" hx-target="#reader-table" hx-swap="outerHTML">Suspender</button>
                {% else %}
                <button class="btn btn-inline" hx-post="/readers/{{ reader.id }}/activate" hx-target="#reader-table" hx-swap="outerHTML">Activar</button>
                {% endif %}
            </td>
        </tr>
        {% else %}
        <tr><td colspan="6">No hay lectores registrados.</td></tr>
        {% endfor %}
    </tbody>
</table>
