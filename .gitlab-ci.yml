stages:
  - test

test:
  stage: test
  image: python:3.13-slim
  before_script:
    - pip install uv
    - uv sync --all-groups
  script:
    - uv run ruff check .
    - uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
    - uv run pytest --cov=app.services --cov-report=term-missing --cov-fail-under=80
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
